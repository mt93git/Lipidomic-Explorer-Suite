<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- Nexo chart-type icon set. 24x24 grid, 1.5 px stroke, round caps and joins, currentColor.
       One <symbol> per chart TYPE; icons-map.json maps every catalog id to a symbol id.
       Use: <svg width="20" height="20"><use href="#nx-violin"/> (sprite inlined once by the library)</svg> -->
  <defs>
    <g id="nx-axes-base" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v17h17"/></g>
  </defs>

  <!-- Scatter: PCA scores, outlier PCA, cohort comparison -->
  <symbol id="nx-scatter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 3v17h17"/><circle cx="9" cy="14" r="1.6"/><circle cx="13" cy="8" r="1.6"/><circle cx="17" cy="12" r="1.6"/><circle cx="11" cy="17" r="1.1" fill="currentColor" stroke="none"/><circle cx="16" cy="6" r="1.1" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- 3D scatter: PCA scores and loadings in three dimensions -->
  <symbol id="nx-scatter-3d" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 8l7-4 7 4v8l-7 4-7-4z"/><path d="M5 8l7 4 7-4M12 12v8"/><circle cx="9" cy="10" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="14" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="7" r="1.2" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- Loadings: vectors from the origin -->
  <symbol id="nx-loadings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v18M3 12h18"/><path d="M12 12l6-5M18 7h-3.2M18 7v3.2"/><path d="M12 12l-5 5M7 17h3.2M7 17v-3.2"/><path d="M12 12l5.5 3.5"/>
  </symbol>

  <!-- Quadrant map: scatter with four regions (storage vs structural) -->
  <symbol id="nx-quadrant" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/><path d="M12 3.5v17M3.5 12h17" stroke-dasharray="2 2"/><circle cx="8" cy="8" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="7.5" r="1.3"/>
  </symbol>

  <!-- Violin -->
  <symbol id="nx-violin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3c-2.5 2.5-2.5 5.5 0 9-2.5 3.5-2.5 6.5 0 9 2.5-2.5 2.5-5.5 0-9 2.5-3.5 2.5-6.5 0-9Z"/><path d="M16 5c-2 2-2 4 0 7-2 3-2 5 0 7 2-2 2-4 0-7 2-3 2-5 0-7Z"/><path d="M8 9v6M16 10v4"/>
  </symbol>

  <!-- Box plot -->
  <symbol id="nx-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 4v3M7 17v3M5 4h4M5 20h4"/><rect x="4" y="7" width="6" height="10" rx="1"/><path d="M4 12h6"/><path d="M17 6v2M17 15v3M15 6h4M15 18h4"/><rect x="14" y="8" width="6" height="7" rx="1"/><path d="M14 11h6"/>
  </symbol>

  <!-- Strip / dot plot per group -->
  <symbol id="nx-strip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20h16"/><circle cx="8" cy="7" r="1.2" fill="currentColor" stroke="none"/><circle cx="8" cy="11" r="1.2" fill="currentColor" stroke="none"/><circle cx="8" cy="15" r="1.2" fill="currentColor" stroke="none"/><circle cx="16" cy="9" r="1.2"/><circle cx="16" cy="13" r="1.2"/><circle cx="16" cy="16.5" r="1.2"/><path d="M6 11h4M14 13h4"/>
  </symbol>

  <!-- Bars -->
  <symbol id="nx-bar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20h16"/><rect x="5.5" y="11" width="3.5" height="9" rx=".8"/><rect x="10.25" y="5" width="3.5" height="15" rx=".8"/><rect x="15" y="14" width="3.5" height="6" rx=".8"/>
  </symbol>

  <!-- Grouped bars: two cohorts side by side -->
  <symbol id="nx-bar-grouped" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 20h18"/><rect x="4.5" y="9" width="3" height="11" rx=".7"/><rect x="8" y="13" width="3" height="7" rx=".7" fill="currentColor" fill-opacity=".35"/><rect x="13" y="6" width="3" height="14" rx=".7"/><rect x="16.5" y="11" width="3" height="9" rx=".7" fill="currentColor" fill-opacity=".35"/>
  </symbol>

  <!-- Stacked bars: composition -->
  <symbol id="nx-bar-stacked" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20h16"/><rect x="6" y="4" width="4.5" height="16" rx=".8"/><path d="M6 10h4.5M6 15h4.5"/><rect x="13.5" y="7" width="4.5" height="13" rx=".8"/><path d="M13.5 12h4.5M13.5 16h4.5"/><path d="M6 15.5h4.5v4H6z" fill="currentColor" fill-opacity=".35" stroke="none"/><path d="M13.5 16.5h4.5v3h-4.5z" fill="currentColor" fill-opacity=".35" stroke="none"/>
  </symbol>

  <!-- Diverging bars: shifts around zero -->
  <symbol id="nx-bar-diverging" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v18"/><rect x="12" y="5" width="7" height="3" rx=".7"/><rect x="7" y="10.5" width="5" height="3" rx=".7" fill="currentColor" fill-opacity=".35"/><rect x="12" y="16" width="4" height="3" rx=".7"/>
  </symbol>

  <!-- Donut share -->
  <symbol id="nx-donut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 4v4.5M15.5 12H20M12 15.5V20"/><path d="M12 4a8 8 0 0 1 8 8h-4.5a3.5 3.5 0 0 0-3.5-3.5z" fill="currentColor" fill-opacity=".35" stroke="none"/>
  </symbol>

  <!-- Density / distribution curve -->
  <symbol id="nx-density" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 20h18"/><path d="M3 18c3 0 3-10 6-10s3 8 6 8 3-6 6-6"/><path d="M3 18c3 0 3-10 6-10s3 8 6 8 3-6 6-6v8H3z" fill="currentColor" fill-opacity=".18" stroke="none"/>
  </symbol>

  <!-- Histogram -->
  <symbol id="nx-histogram" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 20h18"/><path d="M4 20v-5h3v5M7 20V9h3v11M10 20V4h3v16M13 20V8h3v12M16 20v-7h3v7"/>
  </symbol>

  <!-- Heatmap -->
  <symbol id="nx-heatmap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/><path d="M3.5 3.5h5.7v5.7H3.5zM9.2 9.2h5.6v5.6H9.2zM14.8 14.8h5.7v5.7h-5.7z" fill="currentColor" fill-opacity=".9" stroke="none"/><path d="M14.8 3.5h5.7v5.7h-5.7zM3.5 14.8h5.7v5.7H3.5z" fill="currentColor" fill-opacity=".35" stroke="none"/>
  </symbol>

  <!-- Correlation matrix (symmetric) -->
  <symbol id="nx-matrix" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/><path d="M3.5 20.5L20.5 3.5"/><path d="M3.5 3.5h5.7v5.7H3.5zM9.2 9.2h5.6v5.6H9.2zM14.8 14.8h5.7v5.7h-5.7z" fill="currentColor" fill-opacity=".9" stroke="none"/><circle cx="17.5" cy="6.5" r="1.3" fill="currentColor" fill-opacity=".4" stroke="none"/><circle cx="6.5" cy="17.5" r="1.3" fill="currentColor" fill-opacity=".4" stroke="none"/>
  </symbol>

  <!-- Volcano -->
  <symbol id="nx-volcano" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 3v17h17"/><path d="M12 20V8" stroke-dasharray="2 2"/><path d="M6 13h14" stroke-dasharray="2 2"/><circle cx="7" cy="8" r="1.3" fill="currentColor" stroke="none"/><circle cx="17.5" cy="6.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="10" cy="15.5" r="1.1"/><circle cx="14" cy="16.5" r="1.1"/><circle cx="12" cy="18" r="1.1"/>
  </symbol>

  <!-- Lollipop (enrichment) -->
  <symbol id="nx-lollipop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4v16"/><path d="M4 7h10M4 12h6M4 17h13"/><circle cx="15.5" cy="7" r="1.8" fill="currentColor" stroke="none"/><circle cx="11.5" cy="12" r="1.8"/><circle cx="18.5" cy="17" r="1.8" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- Dot grid (structural grid dotplot) -->
  <symbol id="nx-dotplot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 3v17h17"/><circle cx="8.5" cy="7.5" r="1.2"/><circle cx="13" cy="7.5" r="2" fill="currentColor" stroke="none"/><circle cx="17.5" cy="7.5" r="1.2"/><circle cx="8.5" cy="12.5" r="2" fill="currentColor" fill-opacity=".45" stroke="none"/><circle cx="13" cy="12.5" r="1.2"/><circle cx="17.5" cy="12.5" r="2.4" fill="currentColor" stroke="none"/><circle cx="8.5" cy="17" r="1"/><circle cx="13" cy="17" r="1.6" fill="currentColor" fill-opacity=".45" stroke="none"/>
  </symbol>

  <!-- Small multiples (grid of panels) -->
  <symbol id="nx-small-multiples" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/><path d="M5.5 8.5l1.5-2 1.5 1 1.5-2M15.5 8.5l1.5-1 1.5 1M5.5 18.5h4M15.5 18.5l1.5-2.5 1.5 2.5"/>
  </symbol>

  <!-- Network (correlation, interactive pathway) -->
  <symbol id="nx-network" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="2.4"/><circle cx="5" cy="6" r="1.8"/><circle cx="19" cy="6" r="1.8"/><circle cx="5" cy="18" r="1.8"/><circle cx="19" cy="18" r="1.8"/><path d="M6.4 7.2l3.9 3.2M17.6 7.2l-3.9 3.2M6.4 16.8l3.9-3.2M17.6 16.8l-3.9-3.2"/>
  </symbol>

  <!-- Pathway map (directed flow) -->
  <symbol id="nx-pathway" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="6" height="4" rx="1"/><rect x="15" y="4" width="6" height="4" rx="1"/><rect x="9" y="16" width="6" height="4" rx="1"/><path d="M9 6h6M12 8v8"/><path d="M13.6 4.6L15 6l-1.4 1.4M10.6 14.6L12 16l1.4-1.4"/>
  </symbol>

  <!-- Line / time course -->
  <symbol id="nx-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 3v17h17"/><path d="M6 15l4-5 4 3 6-7"/><circle cx="6" cy="15" r="1.2" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="1.2" fill="currentColor" stroke="none"/><circle cx="14" cy="13" r="1.2" fill="currentColor" stroke="none"/><circle cx="20" cy="6" r="1.2" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- Multi-line: all metrics over time -->
  <symbol id="nx-line-multi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 3v17h17"/><path d="M6 16l4-4 4 2 6-6"/><path d="M6 11l4-3 4 1 6-4" stroke-opacity=".45"/><path d="M6 18l4-1 4-2 6-1" stroke-opacity=".45"/>
  </symbol>

  <!-- Circos / chord -->
  <symbol id="nx-circos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/><path d="M8 4.6a8.5 8.5 0 0 1 8 0" stroke-width="3"/><path d="M4.4 14a8.5 8.5 0 0 0 4.6 5.5" stroke-width="3"/><path d="M7.5 19.2C10 14 14 9 16.5 5.2M9.5 4.6c1 5 5 8 10 10" stroke-opacity=".6"/>
  </symbol>

  <!-- Pulse / quality check -->
  <symbol id="nx-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12h4l3-7 4 14 3-7h4"/>
  </symbol>

  <!-- Deviation band: value with limits -->
  <symbol id="nx-band" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 3v17h17"/><path d="M6 8h14M6 16h14" stroke-dasharray="2 2"/><path d="M6 12h14" stroke-opacity=".5"/><circle cx="8" cy="12.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="10.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="16" cy="13" r="1.2" fill="currentColor" stroke="none"/><circle cx="19" cy="6" r="1.2"/>
  </symbol>

  <!-- Page / publication preview -->
  <symbol id="nx-page" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><rect x="8.5" y="11" width="7" height="5" rx=".8"/><path d="M8.5 18.5h7"/>
  </symbol>

  <!-- Family glyphs (section headers and rail), same grid and stroke -->
  <symbol id="nx-fam-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.2"/></symbol>
  <symbol id="nx-fam-molecule" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.9l7.5-3.8M8.2 13.1l7.5 3.8"/></symbol>
  <symbol id="nx-fam-cell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r="1.4"/><circle cx="15" cy="14" r="2.3"/></symbol>
  <symbol id="nx-fam-illustration" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><circle cx="9" cy="9.5" r="1.6"/><path d="M4 17l5-4 3 2.5 3.5-4L20 17"/></symbol>
</svg>

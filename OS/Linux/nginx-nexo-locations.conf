# Paste inside the existing server block listening on 127.0.0.1:3880
# in /etc/nginx/conf.d/lipidomic-explorer.conf.
# auth_basic is inherited from that server block; keep it enabled.
location /api/ {
    proxy_pass http://127.0.0.1:3960/api/;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    client_max_body_size 2m;
}

location = /nexo {
    return 301 /nexo/;
}

location /nexo/ {
    alias /home/gjb47/nexo/dist/;
    try_files $uri $uri/ /nexo/index.html;
}

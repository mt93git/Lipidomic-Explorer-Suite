<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexo collaboration · interactive prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700&display=swap" rel="stylesheet">
<style>
/* Tokens: frontends/nexo/src/tokens.css (AAA values) */
:root{--accent:#235273;--navy:#162230;--ink:#141b24;--muted:#44505e;--line:#e3e7ec;--line-strong:#cfd6de;--tint:#eaf1f7;--paper:#fff;--canvas:#f3f5f7;--grid-dot:#cdd6e2;
--amber-bg:#fff4e0;--amber-fg:#6b4200;--blue-bg:#e7f0fa;--blue-fg:#1d4f7c;--red-bg:#fdecea;--red-fg:#8a1f11;--green:#2e8b57;--green-strong:#1b5e3a;--saving:#d9a12b;--error:#e0634f;--danger:#9b2c2c;
--font:'Nunito Sans',system-ui,sans-serif;--r-sm:6px;--r-md:8px;--r-lg:12px;--shadow-card:0 2px 10px #16223014;--shadow-pop:0 2px 6px #16223014,0 10px 28px #16223018;
--bar-top:48px;--bar-tabs:42px;--rail:56px;--insp:320px;--motion:150ms;
--u-me:#235273;--u-tomas:#c2410c;--u-lee:#6d28d9;--u-okafor:#0f766e;--u-mia:#be185d}
@media(prefers-reduced-motion:reduce){:root{--motion:0ms}}
*{box-sizing:border-box}html,body{height:100%;margin:0}[hidden]{display:none!important}
body{font:14px/1.55 var(--font);color:var(--ink);background:var(--canvas);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{background:none;border:0;padding:0;cursor:pointer;border-radius:var(--r-sm)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* Reviewer bar (Spanish, not product UI) */
#scenes{position:fixed;left:0;right:0;top:0;height:30px;z-index:1000;display:flex;align-items:center;gap:4px;padding:0 8px;background:#fde68a;color:#3b2f05;font-size:12px;border-bottom:1px solid #d9b52a;overflow-x:auto;white-space:nowrap}
#scenes strong{margin-right:4px}#scenes button{padding:3px 8px;border:1px solid #c9a227;background:#fff7d6;border-radius:999px;font-size:12px}
#scenes button[aria-pressed=true]{background:#3b2f05;color:#fff;border-color:#3b2f05}
body.scenes #app{top:30px}body:not(.scenes) #scenes{display:none}
#note{position:absolute;right:16px;top:132px;z-index:900;max-width:360px;background:#fff7d6;border:1px solid #d9b52a;color:#3b2f05;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:var(--shadow-pop)}
#note b{display:block;margin-bottom:2px}#note button{position:absolute;top:4px;right:6px;color:#8a6d00;font-size:14px}
body.insp-open #note{right:calc(var(--insp) + 16px)}body.scene-8 #note{top:auto;bottom:16px}

/* App shell */
#app{position:absolute;inset:0;display:grid;grid-template-rows:var(--bar-top) minmax(0,1fr)}
.topbar{display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--navy);color:#fff;font-size:13px}
.topbar .logo{width:28px;height:28px;border-radius:7px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:12px}
.topbar h1{font-size:14px;font-weight:700;margin:0 4px 0 0}
.topbar .project{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;color:#fff}
.topbar .project:hover{background:#ffffff14}
.topbar nav{display:flex;gap:2px;margin-left:12px}.topbar nav a{color:#c4d1dc;text-decoration:none;padding:5px 12px;border-radius:999px}
.topbar nav [aria-current]{color:#fff;background:var(--accent)}.topbar .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid #ffffff2e;color:#e6edf3;font-size:12px;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:#7fd1a1}.pill.syncing .dot{background:#8fc5f7}.pill.reconnecting .dot{background:#f2c14e;animation:blink 1s infinite}.pill.offline .dot{background:#ff8a7a}.pill.readonly .dot{background:#c4d1dc}.pill.busy .dot{background:#f2c14e}
@keyframes blink{50%{opacity:.3}}
.share{height:30px;padding:0 12px;border-radius:999px;background:#fff;color:var(--navy);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.presence{display:flex;align-items:center}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;border:2px solid var(--navy);margin-left:-8px;position:relative;background:var(--c)}
.av:first-child{margin-left:0}.av.me{box-shadow:0 0 0 2px #fff}
.av .dev{position:absolute;right:-4px;bottom:-4px;width:14px;height:14px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.av .dev svg{width:9px;height:9px;stroke:#fff}
.av.presenting::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #7fd1a1}
.iconbtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#c4d1dc}.iconbtn:hover{background:#ffffff14;color:#fff}
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) 0;min-height:0;position:relative;transition:grid-template-columns var(--motion)}
.shell.insp-open{grid-template-columns:var(--rail) minmax(0,1fr) var(--insp)}
.rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;background:var(--paper);border-right:1px solid var(--line)}
.rail button{width:38px;height:38px;display:grid;place-items:center;color:var(--muted);border-radius:var(--r-md);position:relative}.rail button[aria-pressed=true]{background:var(--tint);color:var(--accent);box-shadow:inset 0 0 0 1px #235273;}
.rail .sep{width:28px;height:1px;background:var(--line);margin:4px 0}
.rail .badge{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.main{display:grid;grid-template-rows:var(--bar-tabs) 30px minmax(0,1fr);min-height:0;background:var(--canvas)}
.tabsbar{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--paper);border-bottom:1px solid var(--line);font-size:13px;overflow:hidden;white-space:nowrap}
.tab{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:var(--r-md);background:var(--tint);color:var(--accent);font-weight:600}
.tab small{background:#fff;border-radius:999px;padding:0 6px;font-weight:600;color:var(--muted)}
.tabsbar .act{padding:4px 8px;border-radius:var(--r-sm);color:var(--ink)}.tabsbar .act:hover{background:var(--tint)}.tabsbar .act.muted{color:#8a95a3}
.tabsbar .draft{background:var(--blue-bg);color:var(--blue-fg);padding:4px 10px;border-radius:999px;font-weight:600}
.tabsbar .sp{width:14px}.tabsbar .grow{flex:1}
.engine{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--amber-bg);color:var(--amber-fg);font-weight:600;font-size:12px}
.engine .spin{width:10px;height:10px;border:2px solid #d9a12b;border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hintbar{display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--muted);background:var(--paper);border-bottom:1px solid var(--line)}
.hintbar .follow{margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:#efe6ff;color:#4c1d95;padding:3px 4px 3px 10px;border-radius:999px;font-weight:600}
.hintbar .follow button{background:#fff;border:1px solid #c4b5fd;padding:1px 8px;border-radius:999px;font-size:12px}

/* Viewport & board */
#viewport{position:relative;overflow:hidden;background:var(--canvas);background-image:radial-gradient(var(--grid-dot) 1px,transparent 1px);background-size:24px 24px}
#board{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.card{position:absolute;background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow-card);border:1px solid var(--line);overflow:visible;display:flex;flex-direction:column}
.card .head{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.card .head .st{width:7px;height:7px;border-radius:50%;background:var(--green)}.card .head .st.amber{background:#d9a12b}
.card .head .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .head .hb{width:26px;height:26px;display:grid;place-items:center;color:var(--muted);border-radius:var(--r-sm)}
.card .body{flex:1;display:grid;place-items:center;padding:8px;overflow:hidden;min-height:0}.card .body svg{width:100%;height:100%}
.card.sel{outline:2px solid var(--uc,var(--accent));outline-offset:-1px;box-shadow:0 0 0 4px color-mix(in srgb,var(--uc,var(--accent)) 16%,transparent),var(--shadow-card)}
.card .tag{position:absolute;top:-11px;left:12px;background:var(--uc);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;line-height:18px;white-space:nowrap}
.card.sel .tag{display:block}.card .tag{display:none}
.card .upd{position:absolute;left:10px;bottom:8px;display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;font-size:11px;padding:3px 9px;border-radius:999px;opacity:0;transition:opacity var(--motion)}
.card .upd.on{opacity:1}.card .upd .mini{width:14px;height:14px;border-radius:50%;font-size:8px;font-weight:700;display:grid;place-items:center;background:var(--uc)}
.card .veil{position:absolute;inset:40px 0 0 0;background:#ffffffb3;display:none;place-items:center;color:var(--muted);font-size:12px;font-weight:600;gap:8px}
.card.updating .veil{display:grid}.card .veil .spin{width:14px;height:14px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite}
.card .editing{position:absolute;right:10px;top:46px;display:none;align-items:center;gap:6px;background:#fff;border:1px solid var(--uc);color:var(--uc);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.card.editing-on .editing{display:inline-flex}
.card .pin{position:absolute;width:26px;height:26px;border-radius:50% 50% 50% 4px;background:var(--uc);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;transform:translate(-50%,-100%) ;box-shadow:0 2px 6px #00000033}
.card .pin.resolved{background:#8a95a3}.card .pin.active{outline:3px solid #fff;box-shadow:0 0 0 2px var(--uc)}
.card .votes{position:absolute;right:10px;bottom:8px;display:inline-flex;align-items:center;gap:4px;background:var(--tint);color:var(--accent);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.bpin{position:absolute;width:26px;height:26px;border-radius:50% 50% 50% 4px;background:var(--uc);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;transform:translate(-50%,-100%);box-shadow:0 2px 6px #00000033}
.ghost{position:absolute;border:2px dashed var(--uc);border-radius:var(--r-lg);pointer-events:none;opacity:.8}
/* cursors (screen coordinates after transform) */
#cursors{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cur{position:absolute;left:0;top:0;transition:transform 90ms linear;will-change:transform}
.cur svg{width:18px;height:18px;filter:drop-shadow(0 1px 2px #00000040)}
.cur .name{position:absolute;left:14px;top:16px;background:var(--uc);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.cur .name small{font-weight:400;opacity:.85;margin-left:4px}
/* minimap */
.minimap{position:absolute;left:16px;bottom:56px;width:116px;height:76px;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-card);overflow:hidden}
.minimap .mc{position:absolute;background:#c3cfdb;border-radius:1px}.minimap .mc.fin{background:#8fa6bb}
.minimap .vp{position:absolute;border:1.5px solid var(--uc,var(--accent));background:color-mix(in srgb,var(--uc,var(--accent)) 12%,transparent);border-radius:2px}
.minimap .vp.me{border-width:2px}
.minimap .vp i{position:absolute;left:-1px;top:-9px;font:700 8px/10px var(--font);font-style:normal;color:#fff;background:var(--uc);padding:0 3px;border-radius:3px}
.zoom{position:absolute;left:16px;bottom:16px;display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow-card);font-size:12px}
.zoom b{font-weight:600}
/* Inspector */
.inspector{background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:auto}
.inspector .ih{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}.inspector .ih h2{font-size:14px;margin:0;flex:1}
.inspector .row{display:flex;gap:8px;padding:0 16px 10px}
.btn{height:30px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:#fff;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{color:var(--danger);border-color:#e0c7c7}
.inspector .status{padding:0 16px 8px;font-size:12px;color:var(--muted)}
.inspector .tabs{display:flex;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);font-size:13px}.inspector .tabs span{padding:8px 0}.inspector .tabs span[aria-current]{color:var(--accent);font-weight:600;border-bottom:2px solid var(--accent)}
.inspector .sec{padding:12px 16px;border-bottom:1px solid var(--line)}.inspector .sec h3{font-size:12px;margin:0 0 8px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.field{display:grid;gap:4px;margin-bottom:10px;font-size:12px}.field label{color:var(--muted)}.field .ctl{height:30px;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:0 8px;display:flex;align-items:center;justify-content:space-between;background:#fff;font-size:13px;position:relative}
.field.locked .ctl{border-color:var(--uc);background:color-mix(in srgb,var(--uc) 6%,#fff)}
.field .who{position:absolute;right:-6px;top:-10px;background:var(--uc);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px}
.lockbanner{margin:10px 16px;padding:8px 10px;border-radius:var(--r-md);background:color-mix(in srgb,var(--uc) 10%,#fff);border:1px solid color-mix(in srgb,var(--uc) 45%,#fff);font-size:12px;display:flex;gap:8px;align-items:flex-start}
.lockbanner .mini{width:20px;height:20px;border-radius:50%;background:var(--uc);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;flex:none}
.lockbanner b{display:block}
/* Side panels (comments, versions) reuse inspector */
.cm{padding:10px 16px;border-bottom:1px solid var(--line)}
.cm .by{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px}.cm .by .mini{width:22px;height:22px;border-radius:50%;background:var(--uc);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center}
.cm .by b{font-weight:700}.cm .by small{color:var(--muted)}.cm p{margin:0 0 0 30px;font-size:13px}.cm .m{color:var(--accent);font-weight:600;background:var(--tint);padding:0 4px;border-radius:4px}
.cm .anchor{margin-left:30px;font-size:11px;color:var(--muted)}
.composer{margin:10px 16px;border:1px solid var(--line-strong);border-radius:var(--r-md);padding:8px;font-size:13px;position:relative}
.composer .ph{color:#8a95a3}.composer .mention{position:absolute;left:8px;top:40px;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-pop);padding:4px;min-width:200px;z-index:2}
.composer .mention div{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-size:12px}.composer .mention div[aria-selected]{background:var(--tint)}
.composer .mention .mini{width:18px;height:18px;border-radius:50%;background:var(--uc);color:#fff;font-size:8px;font-weight:700;display:grid;place-items:center}
.composer .foot{display:flex;justify-content:flex-end;gap:6px;margin-top:28px}
.ver{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;align-items:flex-start}
.ver .mini{width:22px;height:22px;border-radius:50%;background:var(--uc);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:2px}
.ver b{display:block;font-size:13px}.ver .grow{flex:1}.ver .auto b{font-weight:600;color:var(--muted)}
.ver.current{background:var(--tint)}.ver .curbadge{background:var(--green);color:#fff;font-size:10px;padding:0 6px;border-radius:999px;font-weight:700}
.act{display:flex;gap:8px;padding:6px 16px;font-size:12px;align-items:center}.act .mini{width:18px;height:18px;border-radius:50%;background:var(--uc);color:#fff;font-size:8px;font-weight:700;display:grid;place-items:center;flex:none}
.act small{color:var(--muted);margin-left:auto;white-space:nowrap}
/* Toast */
.toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 8px 8px 14px;border-radius:var(--r-md);font-size:13px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-pop);opacity:0;transition:opacity var(--motion);white-space:nowrap}
.toast.on{opacity:1}.toast button{background:#ffffff1f;padding:3px 10px;border-radius:999px;font-weight:600}
/* Modal (share) */
.modal{position:absolute;inset:0;background:#16223066;display:grid;place-items:center;z-index:50}
.dlg{width:560px;max-width:calc(100% - 32px);background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-pop);padding:20px 22px}
.dlg h2{margin:0 0 4px;font-size:18px}.dlg .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.dlg .invite{display:flex;gap:8px;margin-bottom:12px}.dlg .invite .ctl{flex:1;height:34px;border:1px solid var(--line-strong);border-radius:var(--r-sm);display:flex;align-items:center;padding:0 10px;color:#8a95a3}
.member{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.member .mini{width:30px;height:30px;border-radius:50%;background:var(--uc);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.member .n b{display:block}.member .n small{color:var(--muted)}.member .org{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--tint);color:var(--accent)}.member .org.client{background:#efe6ff;color:#4c1d95}
.member .role{margin-left:auto;height:28px;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:0 8px;background:#fff;font-size:12px}
.linkrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--canvas);font-size:12px;margin-bottom:12px}
.linkrow b{display:block;font-size:13px}.linkrow .grow{flex:1}
.dlg .note{font-size:11px;color:var(--muted);background:var(--amber-bg);color:var(--amber-fg);padding:8px 10px;border-radius:var(--r-sm);margin-top:12px}
/* Connection states gallery (scene 7) */
.states{position:absolute;left:16px;right:16px;bottom:16px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;z-index:5}
.state{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;font-size:12px;box-shadow:var(--shadow-card)}
.state.on{outline:2px solid var(--accent)}.state b{display:block;font-size:13px;margin-bottom:2px}.state .pill{color:var(--ink);border-color:var(--line-strong);height:24px;margin-bottom:6px}
/* Phone */
@media(max-width:480px){
  .shell{grid-template-columns:minmax(0,1fr)!important}.rail{display:none}.inspector{display:none}#note{display:none}.states{display:none!important}
  .topbar nav,.topbar h1,.topbar .share span,.topbar .pill span:last-child{display:none}.topbar{gap:6px;padding:0 8px}.topbar .share{width:32px;padding:0;justify-content:center}
  .tabsbar .act,.tabsbar .draft,.tabsbar .sp{display:none}.tabsbar .view{display:inline-flex!important}
  .hintbar{font-size:11px}.minimap{display:none}.zoom{display:none}#note{max-width:calc(100% - 32px);right:16px;left:16px;bottom:12px}
  .states{grid-template-columns:repeat(2,1fr);bottom:auto;top:90px}
  .sheet{display:block!important}
}
.tabsbar .view{display:none;align-items:center;gap:6px;background:var(--tint);color:var(--accent);padding:3px 10px;border-radius:999px;font-weight:600;font-size:12px}
.sheet{display:none;position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -4px 24px #16223022;padding:10px 16px 16px;font-size:13px;z-index:6}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto 10px}
.sheet .pl{display:flex;gap:8px;align-items:center;margin-top:8px}

<body class="scenes">
<div id="scenes" role="toolbar" aria-label="Escenas del prototipo">

</div>

  <div class="shell" id="shell">

      <span class="sep"></span>
      <button id="railComments" aria-label="Comments"><svg class="ic" viewBox="0 0 20 20"><path d="M3 4h14v9H8l-4 3v-3H3z"/></svg><span class="badge">3</span></button>
      <button id="railHistory" aria-label="Version history"><svg class="ic" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg></button>
    </aside>
    <div class="main">
      <div class="tabsbar">
        <span class="tab">Canvas 1 <small>4</small></span><button class="act">+</button><button class="act">···</button>
        <span class="sp"></span>
        <button class="act">Targeted lipids</button><button class="act">Analysis settings</button><button class="act">+ Add plot</button><button class="act">Tidy up</button>
        <button class="act muted">↶ Undo</button><button class="act muted">↷ Redo</button>

  </div>

  <div id="note" hidden><button id="noteClose" aria-label="Cerrar nota">×</button><b></b><span></span></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const FIXED=params.has('at')?Number(params.get('at')):null;
const t0=performance.now();const now=()=>FIXED!==null?FIXED:performance.now()-t0;
/* Fictional people only */
const U={
  me:{id:'me',name:'Ana R.',org:'Lab',ini:'AR',c:'var(--u-me)',role:'Owner'},
  tomas:{id:'tomas',name:'Tomás',org:'Lab',ini:'T',c:'var(--u-tomas)',role:'Editor'},
  lee:{id:'lee',name:'Dr. Lee',org:'Client',ini:'DL',c:'var(--u-lee)',role:'Editor'},
  okafor:{id:'okafor',name:'M. Okafor',org:'Client',ini:'MO',c:'var(--u-okafor)',role:'Viewer',phone:true},
  mia:{id:'mia',name:'Mia S.',org:'Client',ini:'MS',c:'var(--u-mia)',role:'Commenter'}
};
const CARDS=[
  {id:'pca',title:'Principal components',x:260,y:90,w:440,h:330,kind:'pca',st:'green'},
  {id:'violin',title:'Feature distributions',x:740,y:90,w:440,h:330,kind:'violin',st:'green'},
  {id:'lcms',title:'LC–MS instrument',x:260,y:460,w:300,h:210,kind:'ill',st:'green'},
  {id:'volcano',title:'Differential lipids',x:740,y:460,w:440,h:280,kind:'volcano',st:'amber'}
];
const S={scene:'1',cam:{x:0,y:0,k:1},sel:{},edit:null,follow:null,comments:false,panel:null,activePin:null,conn:'live',engine:null,ghost:null};
/* ---------- SVG plots (static illustrations of Team's plots) ---------- */
function plot(kind,v){
  const blue='#3b6ea5',red='#c0504d';
  if(kind==='pca')return `<svg viewBox="0 0 420 270"><text x="210" y="22" text-anchor="middle" font-size="16" fill="#141b24">PCA</text>
  <g stroke="#e3e7ec"><line x1="60" y1="40" x2="60" y2="230"/><line x1="60" y1="230" x2="360" y2="230"/><line x1="210" y1="40" x2="210" y2="230"/><line x1="60" y1="135" x2="360" y2="135"/></g>
  <g font-size="11" fill="#44505e"><text x="150" y="246" text-anchor="middle">−2</text><text x="210" y="246" text-anchor="middle">0</text><text x="270" y="246" text-anchor="middle">2</text><text x="48" y="234" text-anchor="end">0</text><text x="48" y="138" text-anchor="end">1</text><text x="48" y="44" text-anchor="end">2</text><text x="210" y="262" text-anchor="middle" font-size="12">PC1</text><text x="18" y="140" transform="rotate(-90 18 140)" text-anchor="middle" font-size="12">PC2</text></g>
  <g><circle cx="150" cy="50" r="3.5" fill="${blue}"/><circle cx="120" cy="150" r="3.5" fill="${blue}"/><circle cx="208" cy="228" r="3.5" fill="${blue}"/><circle cx="165" cy="110" r="3.5" fill="${blue}"/><circle cx="300" cy="55" r="3.5" fill="${red}"/><circle cx="330" cy="150" r="3.5" fill="${red}"/><circle cx="250" cy="226" r="3.5" fill="${red}"/><circle cx="290" cy="120" r="3.5" fill="${red}"/></g>
  <g font-size="11" fill="#44505e"><circle cx="376" cy="60" r="3" fill="${blue}"/><text x="384" y="64">Control</text><circle cx="376" cy="80" r="3" fill="${red}"/><text x="384" y="84">Case</text></g></svg>`;
  if(kind==='violin'){const t=v||'PC(16:0/18:1)';return `<svg viewBox="0 0 420 270"><text x="210" y="22" text-anchor="middle" font-size="16" fill="#141b24">${t}</text>
  <g stroke="#e3e7ec"><line x1="60" y1="60" x2="360" y2="60"/><line x1="60" y1="100" x2="360" y2="100"/><line x1="60" y1="140" x2="360" y2="140"/><line x1="60" y1="180" x2="360" y2="180"/><line x1="60" y1="222" x2="360" y2="222" stroke="#141b24"/></g>
  <g font-size="11" fill="#44505e"><text x="50" y="64" text-anchor="end">8</text><text x="50" y="104" text-anchor="end">6</text><text x="50" y="144" text-anchor="end">4</text><text x="50" y="184" text-anchor="end">2</text><text x="50" y="226" text-anchor="end">0</text><text x="140" y="248" text-anchor="middle" font-size="12">Control</text><text x="280" y="248" text-anchor="middle" font-size="12">Case</text></g>
  <path d="M140 88 C120 110 110 150 140 215 C170 150 160 110 140 88Z" fill="${blue}" fill-opacity=".45" stroke="${blue}"/><rect x="133" y="130" width="14" height="40" fill="none" stroke="${blue}" stroke-width="1.5"/><line x1="140" y1="112" x2="140" y2="190" stroke="${blue}"/>
  <path d="M280 60 C255 90 245 140 280 215 C315 140 305 90 280 60Z" fill="${red}" fill-opacity=".45" stroke="${red}"/><rect x="273" y="110" width="14" height="40" fill="none" stroke="${red}" stroke-width="1.5"/><line x1="280" y1="85" x2="280" y2="175" stroke="${red}"/>
  <g font-size="11" fill="#44505e"><rect x="372" y="54" width="8" height="8" fill="${blue}"/><text x="384" y="62">Control</text><rect x="372" y="72" width="8" height="8" fill="${red}"/><text x="384" y="80">Case</text></g></svg>`;}
  if(kind==='ill')return `<svg viewBox="0 0 280 150"><rect x="30" y="20" width="220" height="100" rx="10" fill="#eaf1f7" stroke="#235273"/><text x="140" y="76" text-anchor="middle" font-size="18" fill="#235273">LC-MS</text></svg>`;
  if(kind==='volcano')return `<svg viewBox="0 0 420 220"><text x="210" y="20" text-anchor="middle" font-size="15" fill="#141b24">Case vs Control</text>
  <g stroke="#e3e7ec"><line x1="60" y1="40" x2="60" y2="190"/><line x1="60" y1="190" x2="360" y2="190"/><line x1="210" y1="40" x2="210" y2="190" stroke-dasharray="3 3"/><line x1="60" y1="120" x2="360" y2="120" stroke-dasharray="3 3"/></g>
  <g fill="#9aa8b6">${[[90,170],[120,150],[150,180],[180,160],[200,175],[230,165],[250,185],[280,150],[300,170],[330,160],[190,130],[220,140],[160,135],[260,130]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3"/>`).join('')}</g>
  <g fill="${red}"><circle cx="300" cy="70" r="3.5"/><circle cx="330" cy="55" r="3.5"/><circle cx="280" cy="95" r="3.5"/></g><g fill="${blue}"><circle cx="110" cy="80" r="3.5"/><circle cx="90" cy="60" r="3.5"/></g>
  <g font-size="11" fill="#44505e"><text x="210" y="208" text-anchor="middle">log2 fold change</text><text x="20" y="118" transform="rotate(-90 20 118)" text-anchor="middle">−log10 p</text></g></svg>`;
  return '';
}
/* ---------- rendering ---------- */
const cardEl={};
function renderBoard(){
  const b=$('board');b.innerHTML='';
  for(const c of CARDS){
    const d=document.createElement('div');d.className='card';d.id='card-'+c.id;d.style.cssText=`left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px`;
    d.innerHTML=`<div class="head"><span class="st ${c.st==='amber'?'amber':''}"></span><span class="grow">${c.title}</span><button class="hb" aria-label="Edit"><svg class="ic" viewBox="0 0 20 20" style="width:15px;height:15px"><path d="M4 16l1-4 9-9 3 3-9 9z"/></svg></button><button class="hb" aria-label="Duplicate"><svg class="ic" viewBox="0 0 20 20" style="width:15px;height:15px"><rect x="7" y="7" width="9" height="9" rx="1.5"/><path d="M13 7V4H4v9h3"/></svg></button><button class="hb" aria-label="More">···</button></div>
    <div class="body">${plot(c.kind)}</div><span class="tag"></span><span class="editing"></span><div class="veil"><span class="spin"></span><span class="veiltxt">Updating…</span></div><span class="upd"></span>`;
    b.appendChild(d);cardEl[c.id]=d;
  }
}
function setSel(cid,user){const d=cardEl[cid];if(!d)return;if(!user){d.classList.remove('sel');d.style.removeProperty('--uc');return;}d.classList.add('sel');d.style.setProperty('--uc',user.c);d.querySelector('.tag').textContent=user===U.me?'You':user.name;}
function setEditing(cid,user,field){const d=cardEl[cid];if(!d)return;if(!user){d.classList.remove('editing-on');return;}d.classList.add('editing-on');d.style.setProperty('--uc',user.c);d.querySelector('.editing').textContent=`${user.name} is editing · ${field}`;}
function setUpdated(cid,user,txt){const d=cardEl[cid];const u=d.querySelector('.upd');if(!user){u.classList.remove('on');return;}u.innerHTML=`<span class="mini" style="background:${user.c}">${user.ini}</span>${txt}`;u.classList.add('on');}
function setUpdating(cid,on,txt){const d=cardEl[cid];d.classList.toggle('updating',on);if(txt)d.querySelector('.veiltxt').textContent=txt;}
function cam(x,y,k){S.cam={x,y,k};$('board').style.transform=`translate(${x}px,${y}px) scale(${k})`;$('zoomv').textContent=Math.round(k*100)+'%';renderMinimap();}
function fitAll(){const vp=$('viewport').getBoundingClientRect();const minX=Math.min(...CARDS.map(c=>c.x))-40,minY=Math.min(...CARDS.map(c=>c.y))-40,maxX=Math.max(...CARDS.map(c=>c.x+c.w))+40,maxY=Math.max(...CARDS.map(c=>c.y+c.h))+40;const k=Math.min(1,vp.width/(maxX-minX),vp.height/(maxY-minY));cam((vp.width-(maxX-minX)*k)/2-minX*k,(vp.height-(maxY-minY)*k)/2-minY*k,k);}
/* minimap: board 0..1400 x 0..800 */
const MM={w:116,h:76,bw:1500,bh:820};
const others={};/* id -> {cursor:{x,y}, vp:{x,y,w,h}} in board coords */
function renderMinimap(){
  const m=$('minimap');const sx=MM.w/MM.bw,sy=MM.h/MM.bh;let h='';
  for(const c of CARDS)h+=`<span class="mc ${c.st==='green'?'':'fin'}" style="left:${c.x*sx}px;top:${c.y*sy}px;width:${c.w*sx}px;height:${c.h*sy}px"></span>`;
  for(const id in others){const o=others[id];if(!o.vp||!o.show)continue;const u=U[id];h+=`<span class="vp" style="--uc:${u.c};left:${o.vp.x*sx}px;top:${o.vp.y*sy}px;width:${o.vp.w*sx}px;height:${o.vp.h*sy}px"><i>${u.ini}</i></span>`;}
  const vp=$('viewport').getBoundingClientRect();const mx=-S.cam.x/S.cam.k,my=-S.cam.y/S.cam.k,mw=vp.width/S.cam.k,mh=vp.height/S.cam.k;
  h+=`<span class="vp me" style="--uc:var(--u-me);left:${mx*sx}px;top:${my*sy}px;width:${Math.min(mw,MM.bw)*sx}px;height:${Math.min(mh,MM.bh)*sy}px"></span>`;
  m.innerHTML=h;
}
function renderPresence(list,presenter){
  $('presence').innerHTML=list.map(u=>`<span class="av ${u===U.me?'me':''} ${presenter===u?'presenting':''}" style="--c:${u.c}" title="${u.name} · ${u.org} · ${u.role}${u.phone?' · phone, view only':''}" aria-label="${u.name}, ${u.org}">${u.ini}${u.phone?'<span class="dev"><svg class="ic" viewBox="0 0 20 20"><rect x="6" y="2" width="8" height="16" rx="2"/></svg></span>':''}</span>`).join('');
}
const curEl={};
function cursor(user,x,y,label){/* board coords -> screen */
  let e=curEl[user.id];if(!e){e=document.createElement('div');e.className='cur';e.style.setProperty('--uc',user.c);e.innerHTML=`<svg viewBox="0 0 20 20"><path d="M3 2l13 7-5.5 1.5L8 16z" fill="${user.c}" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg><span class="name">${user.name}<small>${user.org}</small></span>`;$('cursors').appendChild(e);curEl[user.id]=e;}
  if(x===null){e.hidden=true;return;}e.hidden=false;const sx=x*S.cam.k+S.cam.x,sy=y*S.cam.k+S.cam.y;e.style.transform=`translate(${sx}px,${sy}px)`;if(label!==undefined)e.querySelector('.name').innerHTML=`${user.name}<small>${label}</small>`;
}
function clearCursors(){for(const id in curEl)curEl[id].hidden=true;}
function toast(html,ms){const t=$('toast');t.innerHTML=html;t.classList.add('on');clearTimeout(toast.t);if(ms)toast.t=setTimeout(()=>t.classList.remove('on'),ms);}
function conn(state,txt){const p=$('conn');p.className='pill '+state;p.querySelector('span:last-child').textContent=txt;}
function engine(txt){const e=$('engine');if(!txt){e.hidden=true;return;}e.hidden=false;$('engineTxt').textContent=txt;}
function openSide(html){$('shell').classList.add('insp-open');document.body.classList.add('insp-open');$('side').innerHTML=html;}
function closeSide(){$('shell').classList.remove('insp-open');document.body.classList.remove('insp-open');$('side').innerHTML='';}
/* ---------- panels ---------- */
const mini=(u,s=20)=>`<span class="mini" style="background:${u.c};width:${s}px;height:${s}px">${u.ini}</span>`;
function inspectorHTML(opts){
  const locked=opts.locked;const u=U.tomas;
  return `<div class="ih"><h2>Feature distributions</h2><button class="x" aria-label="Close">×</button></div>
  <div class="row"><button class="btn">Duplicate</button><button class="btn">Finish plot</button><button class="btn">···</button></div>
  <div class="status">${opts.status||'Up to date'}</div>
  ${locked?`<div class="lockbanner" style="--uc:${u.c}">${mini(u)}<div><b>${u.name} is editing this card · Data</b>You can still change it; the last change wins and both of you see the result.</div></div>`:''}
  <div class="tabs"><span aria-current="true">Data</span><span>Appearance</span><span>Statistics</span><span>Export</span></div>
  <div class="sec"><h3>FIGURE DETAILS</h3>
   <div class="field ${locked?'locked':''}" style="--uc:${u.c}"><label>Lipid</label><div class="ctl"><span>${opts.lipid||'PC(16:0/18:1)'}</span><span>▾</span>${locked?`<span class="who">${u.name}</span>`:''}</div></div>
   <div class="field"><label>Grouping</label><div class="ctl"><span>Condition</span><span>▾</span></div></div>
   <div class="field"><label>Show points</label><div class="ctl"><span>Yes</span><span>▾</span></div></div>
  </div>
  <div class="sec"><h3>STATISTICS</h3><div style="font-size:12px;color:var(--muted)">${opts.stats||'No statistics applied. Choose the analysis below, then Review and confirm to compute p-values.'}</div></div>`;
}
const COMMENTS=[
  {id:1,card:'violin',px:300,py:120,by:U.lee,at:'10:21',text:'Can we show PC(18:0/18:1) instead? It is the one we discussed on the call.',replies:[{by:U.tomas,at:'10:24',text:'<span class="m">@Dr. Lee</span> yes, changing it now. The p-value will need re-confirming.'},{by:U.me,at:'10:26',text:'Confirmed statistics after the change: p = 0.012 (Mann–Whitney).'}]},
  {id:2,card:'pca',px:380,py:80,by:U.mia,at:'09:58',text:'Legend overlaps the last point at this size.',replies:[],resolved:true},
  {id:3,card:null,px:560,py:430,by:U.lee,at:'10:31',text:'Could the volcano plot go to the figure page as panel C?',replies:[],votes:2}
];
function commentsHTML(active){
  const c=COMMENTS.find(x=>x.id===active)||COMMENTS[0];
  const anchor=c.card?`Pinned to <b>${CARDS.find(k=>k.id===c.card).title}</b>`:'Pinned to the board';
  return `<div class="panelhead"><h2>Comments</h2><span style="font-size:12px;color:var(--muted)">3 open · 1 resolved</span><button class="x" aria-label="Close">×</button></div>
  <div class="seg"><span aria-current="true">This board</span><span>Mentions (1)</span><span>Resolved</span></div>
  <div class="cm" style="--uc:${c.by.c}"><div class="by">${mini(c.by,22)}<b>${c.by.name}</b><small>${c.by.org} · ${c.at}</small></div><p>${c.text}</p><div class="anchor">${anchor}${c.votes?` · <b>${c.votes}</b> votes for panel C`:''}</div></div>

let bots=[];const lerp=(a,b,t)=>a+(b-a)*t;const ease=t=>t<.5?2*t*t:-1+(4-2*t)*t;
function path(points,period){return t=>{const n=points.length;const u=((t%period)/period)*n;const i=Math.floor(u),f=ease(u-i);const a=points[i],b=points[(i+1)%n];return {x:lerp(a[0],b[0],f),y:lerp(a[1],b[1],f)};};}

 '7'(){renderPresence([U.me,U.tomas,U.lee,U.okafor]);baseCam();others.tomas={vp:{x:600,y:40,w:900,h:620},show:true};renderMinimap();

function ghost(cid,user,dx,dy){let g=$('board').querySelector('.ghost');const c=CARDS.find(k=>k.id===cid);if(!g){g=document.createElement('div');g.className='ghost';$('board').appendChild(g);}g.style.cssText=`--uc:${user.c};left:${c.x+dx}px;top:${c.y+dy}px;width:${c.w}px;height:${c.h}px`;return g;}
function unghost(){const g=$('board').querySelector('.ghost');if(g)g.remove();}
function wireSide(){const x=$('side').querySelector('.x');if(x)x.onclick=closeSide;const r=$('resolveBtn');if(r)r.onclick=()=>{document.querySelector('.pin.active,.bpin.active')?.classList.add('resolved');toast('Thread resolved · Dr. Lee will be notified',2500);};}
function go(scene){S.scene=scene;reset();document.body.className=document.body.className.replace(/\bscene-\d\b/g,'').trim()+' scene-'+scene;document.querySelectorAll('#scenes [data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));scenes[scene]();wireSide();
 const n=$('note');n.hidden=params.get('notes')==='0';n.querySelector('b').textContent=`Escena ${scene} · ${NOTES[scene][0]}`;n.querySelector('span').textContent=NOTES[scene][1];
 const u=new URL(location);u.searchParams.set('scene',scene);history.replaceState(null,'',u);for(const b of bots)b(now());}
/* ---------- wiring ---------- */
renderBoard();
document.querySelectorAll('#scenes [data-scene]').forEach(b=>b.onclick=()=>go(b.dataset.scene));
$('hidebar').onclick=()=>document.body.classList.remove('scenes');
$('noteClose').onclick=()=>{$('note').hidden=true;};
$('sharebtn').onclick=()=>{$('modal').hidden=false;$('modal').innerHTML=shareHTML();$('shareClose').onclick=()=>{$('modal').hidden=true;};};
$('railComments').onclick=()=>go('3');$('railHistory').onclick=()=>go('6');
document.querySelectorAll('#presence').forEach(p=>p.addEventListener('click',e=>{const a=e.target.closest('.av');if(a&&S.scene!=='5')toast('Click an avatar to jump to that person · double-click to follow',2200);}));
addEventListener('resize',()=>{renderMinimap();if(S.scene==='7'||S.scene==='1')go(S.scene);});
if(params.get('bar')==='0')document.body.classList.remove('scenes');
go(scenes[params.get('scene')]?params.get('scene'):'1');
tick();

name: Unit Tests & Code Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Automated Unit & Syntax Test Suite
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.4.0'
        use-public-rspm: true

    - name: Install Essential Test Dependencies
      run: |
        install.packages(c("shiny", "testthat"))
      shell: Rscript {0}

    - name: Run Recursive Syntax Audit (45 R Scripts)
      run: |
        Rscript tests/test_recursive_syntax.R
      shell: bash

    - name: Run Session Restore Helper Unit Tests
      run: |
        Rscript tests/test_restore_helper.R
      shell: bash

    - name: Run Lipid Pathway Logic Unit Tests
      run: |
        Rscript tests/test_pathway_logic.R
      shell: bash

    - name: Run Targeted Fallback Simulation Unit Tests
      run: |
        Rscript tests/test_targeted_fallback_simulation.R
      shell: bash

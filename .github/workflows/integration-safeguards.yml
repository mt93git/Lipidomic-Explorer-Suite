name: Integration safeguards and scientific parity
on:
  push:
    branches: [integration/libreros-guided-workflow, integration/shared-preparation-qc, integration/guided-shared-core]
  pull_request:
    branches: [main, integration/libreros-guided-workflow, integration/shared-preparation-qc]
permissions:
  contents: read
jobs:
  scientific-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Install focused comparison dependencies
        shell: Rscript --vanilla {0}
        run: |
          options(repos=c(CRAN=Sys.getenv('RSPM', 'https://cloud.r-project.org')))
          install.packages(c('shiny', 'dplyr', 'tibble', 'tidyr', 'statmod', 'readxl', 'digest', 'jsonlite', 'zip', 'purrr', 'stringr', 'bslib', 'BiocManager'))
          required <- c('limma','imputeLCMD')
          for (attempt in seq_len(3)) {
            missing <- required[!vapply(required, requireNamespace, logical(1), quietly=TRUE)]
            if (!length(missing)) break
            tryCatch(BiocManager::install(missing, ask=FALSE, update=FALSE),
                     error=function(e) message(conditionMessage(e)))
            if (attempt < 3) Sys.sleep(5)
          }
          stopifnot(all(vapply(required, requireNamespace, logical(1), quietly=TRUE)))
      - name: Run existing lightweight regression suites
        run: |
          Rscript --vanilla tests/test_recursive_syntax.R
          Rscript --vanilla tests/test_restore_helper.R
          Rscript --vanilla tests/test_pathway_logic.R
          Rscript --vanilla tests/test_targeted_fallback_simulation.R
      - name: Verify integration safeguards
        run: Rscript --vanilla tests/test_integration_safeguards.R
      - name: Compare pinned upstream, candidate and guided snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/lipidomic-baseline"
          git archive d48933ca20e59e67def18f29bc3cf035b81e1ca2 | tar -x -C "$RUNNER_TEMP/lipidomic-baseline"
          Rscript --vanilla tests/integration/compare_versions.R "$RUNNER_TEMP/lipidomic-baseline" parity-evidence
      - name: Verify shared preparation state and detection filtering
        run: Rscript --vanilla tests/block2/test_preparation.R block2-evidence
      - name: Compare Max reference artifacts with Classic defaults
        run: Rscript --vanilla tests/block2/compare_references.R block2-evidence/reference
      - name: Validate metadata and real ZIP serialization
        run: |
          mkdir -p guided-evidence
          Rscript --vanilla tests/guided-shared/test_metadata.R guided-evidence
          Rscript --vanilla tests/guided-shared/test_guided_server.R guided-evidence
          GUIDED_FOCUSED_CI=1 Rscript --vanilla tests/guided-shared/test_hub_adapter.R guided-evidence
      - name: Retain guided evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-shared-evidence
          path: guided-evidence/
      - name: Retain Block 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block2-preparation-evidence
          path: block2-evidence/
      - name: Retain comparison outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-parity
          path: parity-evidence/

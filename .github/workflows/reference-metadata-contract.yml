name: Reference mathematics and metadata contract
on:
  push:
    branches: [integration/reference-metadata-contract]
  pull_request:
    branches: [main]
    paths:
      - 'tools/reference_contract/**'
      - 'prototypes/metadata-contract/**'
      - 'tests/reference-contract/**'
      - 'docs/reference-contract/**'
      - '.github/workflows/reference-metadata-contract.yml'
permissions:
  contents: read
jobs:
  reference-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Install comparison dependencies
        shell: Rscript --vanilla {0}
        run: |
          options(repos=c(CRAN=Sys.getenv('RSPM', 'https://cloud.r-project.org')))
          install.packages(c('shiny','dplyr','tibble','tidyr','readxl','digest','statmod','BiocManager'))
          BiocManager::install(c('limma','imputeLCMD'), ask=FALSE, update=FALSE)
      - name: Verify syntax and metadata contract
        run: |
          Rscript --vanilla tests/test_recursive_syntax.R
          Rscript --vanilla tests/reference-contract/test_metadata.R reference-evidence
      - name: Compare reference artifacts and actual engines
        run: Rscript --vanilla tools/reference_contract/compare.R reference-evidence
      - name: Retain full evidence, including disclosed differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-metadata-evidence
          path: reference-evidence/

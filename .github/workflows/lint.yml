name: Lint Code Style

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'
          use-public-rspm: true

      - name: Install lintr
        run: |
          install.packages("lintr", repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Run linter
        continue-on-error: true
        run: |
          library(lintr)
          lints <- lintr::lint_dir(".")
          if (length(lints) > 0) {
            print(lints)
            quit(status = 1)
          }
        shell: Rscript {0}
